    :root {
      --he-navy: #0D1623;
      --he-blue: #38B6FF;
      --he-blue-dark: #0284C7;
      --he-bg: #F8FAFC;
      --he-surface: #FFFFFF;
      --he-border: #E2E8F0;
      --he-muted: #64748B;
      --he-text: #0F172A;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--he-bg);
      color: var(--he-navy);
      margin: 0;
      padding: 0;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-variant-numeric: tabular-nums;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--he-border);
    }

    .topbar-inner {
      max-width: 1152px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-box {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      border-radius: 8px;
      background: #FFFFFF;
      border: 1px solid var(--he-border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      box-shadow: 0 1px 2px rgba(13, 22, 35, 0.05);
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.02em;
      color: var(--he-navy);
    }

    .brand-title span {
      color: var(--he-blue);
    }

    .badge-pill {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 999px;
      background: #F0F9FF;
      color: #0369A1;
      border: 1px solid #BAE6FD;
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--he-muted);
      margin: 2px 0 0 0;
    }

    .actions-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      border: 1px solid transparent;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background: #FFFFFF;
      color: #334155;
      border-color: #CBD5E1;
    }

    .btn-reset:hover {
      background: #F8FAFC;
    }

    .btn-print {
      background: var(--he-navy);
      color: #FFFFFF;
      box-shadow: 0 1px 3px rgba(13, 22, 35, 0.15);
    }

    .btn-print:hover {
      background: #1E293B;
    }
